<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--gift-red:#8C1C2E;--gift-red-light:#9b2a3c;--cream:#f4f2ec;--beige:#F5E6D3;--gold:#B8902E}
html,body{margin:0;min-height:100%;background:var(--gift-red)!important;color:var(--cream)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.gift-app{width:min(100%,440px);margin:0 auto;min-height:100dvh;padding:18px 18px 48px;display:flex;flex-direction:column;font-family:'Source Serif Pro',Georgia,serif;color:var(--cream)}
.gift-top{display:flex;align-items:center;min-height:44px;padding:0 6px;margin-bottom:18px}
/* Back: a small pill that stays reachable at the bottom while long screens scroll. */
.gift-foot{position:sticky;bottom:max(14px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;min-height:44px;margin-top:28px;pointer-events:none}
.gift-back{pointer-events:auto;min-width:44px;min-height:44px;padding:10px 20px;border:1px solid rgba(245,230,211,.35);border-radius:22px;background:rgba(116,20,36,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.22);color:var(--cream);font:400 15px 'Source Serif Pro',Georgia,serif;letter-spacing:.02em;cursor:pointer;opacity:.92;transition:opacity .2s ease,background .2s ease,transform .2s ease}
.gift-back:hover{opacity:1;background:rgba(116,20,36,.95);transform:translateY(-1px)}
.gift-back.is-hidden{visibility:hidden}
.gift-progress{position:relative;flex:1;height:2px;background:rgba(244,242,236,.35)}
.gift-progress::before,.gift-progress::after{content:"";position:absolute;top:50%;width:10px;height:10px;border:2px solid var(--cream);border-radius:50%;transform:translateY(-50%);background:var(--gift-red)}
.gift-progress::before{left:-5px}.gift-progress::after{right:-5px}
.gift-progress-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--cream);box-shadow:0 0 10px rgba(244,242,236,.6);transition:width .35s ease}
.gift-progress.is-hidden{visibility:hidden}
.gift-screen{flex:1;display:flex;flex-direction:column;align-items:stretch;text-align:center;animation:giftEnter .5s cubic-bezier(.2,.7,.2,1) both}
.gift-screen.is-leaving{opacity:0;transform:translateY(-8px);transition:opacity .18s ease,transform .18s ease;animation:none}
.gift-screen.is-back{animation-name:giftEnterBack}
.gift-rise{animation:giftRise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 45ms + 80ms)}
@keyframes giftEnter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes giftEnterBack{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes giftRise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes giftPick{0%{transform:scale(1)}40%{transform:scale(.96)}75%{transform:scale(1.025)}100%{transform:scale(1)}}
.gift-screen.is-centred{justify-content:center}
.gift-title{font:500 30px/1.25 'Cormorant Garamond',Georgia,serif;margin:6px 0 10px;text-shadow:0 0 8px rgba(255,255,255,.2);outline:none}
.gift-sub{font-style:italic;font-size:16px;line-height:1.5;margin:0 0 20px;opacity:.85}
.gift-copy{font-size:18px;line-height:1.6;margin:0 0 30px}
.gift-stack{display:grid;gap:12px;margin:14px 0 6px}
.gift-actions{display:grid;gap:12px;margin-top:24px}
@media(min-width:768px){.gift-actions.is-row{grid-template-columns:1fr 1fr}}
.gift-btn{display:block;width:100%;min-height:50px;padding:12px 24px;border:2px solid rgba(255,255,255,.7);border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.1));color:var(--cream);font:400 16px 'Source Serif Pro',Georgia,serif;cursor:pointer;transition:box-shadow .2s ease,transform .2s ease,background .2s ease;text-decoration:none;text-align:center}
.gift-btn:hover{box-shadow:0 0 12px rgba(255,255,255,.55);transform:translateY(-2px)}
.gift-btn:disabled{opacity:.55;cursor:wait;transform:none;box-shadow:none}
.gift-btn--main{background:var(--cream);border-color:var(--cream);color:var(--gift-red);font-weight:700}
.gift-btn--outline{background:transparent;border-color:rgba(244,242,236,.7)}
.gift-link{display:inline-block;min-height:44px;padding:12px;margin:8px auto 0;border:0;background:none;color:var(--cream);font:400 15px 'Source Serif Pro',Georgia,serif;text-decoration:underline;cursor:pointer;opacity:.85}
.gift-field{display:block;width:100%;margin:0;padding:13px 14px;border:1px solid var(--beige);border-radius:8px;background:rgba(255,255,255,.06);color:var(--cream);font:400 16px/1.5 'Source Serif Pro',Georgia,serif;text-align:left}
.gift-field::placeholder{color:rgba(244,242,236,.6)}
.gift-field:focus{outline:none;border-color:var(--gold);box-shadow:0 0 10px rgba(184,144,46,.45)}
textarea.gift-field{resize:none;overflow-y:auto;min-height:calc(1.5em * 5 + 28px)}
textarea.gift-field.is-tall{min-height:calc(1.5em * 7 + 28px)}
.gift-error{margin:6px 2px 0;font-size:14px;font-style:italic;color:var(--cream);text-align:left}
.gift-card{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:12px 18px;border:1.5px solid var(--beige);border-radius:8px;background:rgba(255,255,255,.05);color:var(--cream);font:400 16px/1.4 'Source Serif Pro',Georgia,serif;cursor:pointer;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
.gift-card:hover{background:rgba(255,255,255,.1)}
.gift-card.is-selected{border-color:var(--gold);box-shadow:0 0 14px rgba(184,144,46,.55);background:rgba(184,144,46,.12);animation:giftPick .35s ease both}
.gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin:14px 0 6px}
.gift-grid>.is-odd-last{grid-column:1/-1;justify-self:center;width:calc(50% - 7px)}
.gift-tile{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;color:var(--cream);cursor:pointer;font:inherit;text-align:center}
.gift-media{position:relative;display:block;width:100%;aspect-ratio:1/1;border:2px solid var(--beige);border-radius:14px;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;background:rgba(255,255,255,.06)}
.gift-media.is-portrait{aspect-ratio:2/3}
.gift-media::after{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(140,28,46,.17)}
/* Soft shimmer while an image downloads; the image then fades and sharpens in. */
.gift-media::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(245,230,211,.14) 50%,transparent 70%);background-size:220% 100%;opacity:0;transition:opacity .3s ease}
.gift-media.is-loading::before{opacity:1;animation:giftShimmer 1.3s ease-in-out infinite}
@keyframes giftShimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.gift-media img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;border-radius:12px;opacity:1;transform:none;filter:none;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.7,.2,1),filter .55s ease}
.gift-media.is-loading img{opacity:0;transform:scale(1.04);filter:blur(10px)}
.gift-placeholder{display:flex;align-items:center;justify-content:center;position:absolute;inset:0;padding:10px;font-size:11px;line-height:1.3;word-break:break-all;opacity:.55;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 10px,rgba(255,255,255,.08) 10px 20px)}
.gift-tile:hover .gift-media{transform:translateY(-2px)}
.gift-tile.is-selected .gift-media{border-color:var(--gold);box-shadow:0 0 16px rgba(184,144,46,.7);animation:giftPick .35s ease both}
.gift-tile-title{font-size:15px;line-height:1.35}
.gift-mood{display:flex;flex-direction:column;gap:6px;padding:4px;border-radius:16px;transition:box-shadow .3s ease}
.gift-mood.is-missing{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(184,144,46,.5)}
.gift-mood-title{margin:4px 0 0;font-weight:700;font-size:15px;line-height:1.3}
.gift-mood-line{margin:0;font-style:italic;font-size:13px;line-height:1.35;opacity:.85}
.gift-mood-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:auto;padding-top:4px}
.gift-mood-choice{min-height:44px;padding:4px 2px;border:1px solid var(--beige);border-radius:6px;background:transparent;color:var(--cream);font:400 12px/1.15 'Source Serif Pro',Georgia,serif;cursor:pointer}
.gift-mood-choice{transition:background .2s ease,color .2s ease,transform .15s ease}
.gift-mood-choice:active{transform:scale(.95)}
.gift-mood-choice.is-selected{background:var(--beige);color:var(--gift-red);font-weight:700}
.gift-counter{margin:22px 0 0;font-size:14px;opacity:.8}
.gift-ticks{display:grid;gap:12px;margin:14px 0 6px;text-align:left}
.gift-tick{display:flex;align-items:center;gap:14px;min-height:54px;padding:12px 16px;border:1.5px solid var(--beige);border-radius:8px;background:rgba(255,255,255,.05);cursor:pointer;font-size:16px;line-height:1.4}
.gift-tick input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--gold)}
.gift-tick.is-checked{border-color:var(--gold)}
.gift-offer{margin:10px 0 0;padding:30px clamp(20px,6vw,34px);border:1px solid rgba(244,242,236,.25);border-radius:12px;background:radial-gradient(circle at center,var(--gift-red-light),var(--gift-red));text-align:center}
.gift-offer-image{display:block;width:100%;height:auto;margin:0 0 22px;border:2px solid var(--beige);border-radius:12px;object-fit:contain}
.gift-offer h2{font:500 40px/1.1 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
.gift-offer-price{font-size:26px;margin:0 0 16px}
.gift-offer-tag{font-style:italic;font-size:16px;line-height:1.5;margin:0 0 22px}
.gift-offer ul{list-style:none;padding:0;margin:0 0 22px;text-align:left;display:grid;gap:14px;line-height:1.5}
.gift-offer li{position:relative;padding-left:22px}
.gift-offer li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--beige)}
.gift-offer li em{opacity:.8}
.gift-offer-note{font-style:italic;font-size:15px;line-height:1.5;margin:0 0 8px}
.gift-offer-small{font-style:italic;font-size:13px;line-height:1.5;margin:0 0 22px;opacity:.85}
.gift-status{min-height:22px;margin:14px 0 0;font-size:14px;line-height:1.5}
.gift-fade{animation:giftFade 1.6s ease-in-out infinite}
@keyframes giftFade{0%,100%{opacity:.55}50%{opacity:1}}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="gift-app" id="gift-app">
<div class="gift-top">
<div class="gift-progress" id="gift-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="gift-progress-fill" id="gift-progress-fill"></div></div>
</div>
<main class="gift-screen" id="gift-screen"></main>
<nav class="gift-foot" aria-label="Gift steps">
<button class="gift-back is-hidden" id="gift-back" type="button" aria-label="Go back one screen">← Back</button>
</nav>
</div>

track.milestone('gift_buy_tapped', { gift_id: state.gift_id });
flushAll().then(function () {
return fetch(API + '/gift/' + encodeURIComponent(state.gift_id) + '/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
}).then(function (response) {
return response.json().then(function (data) { return { response: response, data: data }; });
}).then(function (result) {
if (result.response.status === 400 && result.data.missing) throw new Error('missing');
if (!result.response.ok || !result.data.url) throw new Error(result.data.error || 'Checkout is unavailable.');
var url = new URL(result.data.url);
if (url.protocol !== 'https:' || url.hostname !== 'checkout.stripe.com') throw new Error('Invalid checkout destination');
track.screenComplete('gift_checkout', { gift_id: state.gift_id });
window.location.assign(url.href);
}).catch(function (error) {
console.error('[SoulBox gift] checkout failed', error);
button.disabled = false;
status.textContent = error.message === 'missing'
? 'A few answers are missing. Please go back and check each screen.'
: 'We could not open checkout. Please check your connection and try again.';
});
});
};
screens.thank_you = function (root) {
root.classList.add('is-centred');
var who = gifter();
root.innerHTML =
'<h1 class="gift-title" tabindex="-1">' + (who ? 'Thank you, ' + esc(who) + '.' : 'Thank you.') + '</h1>' +
'<p class="gift-copy">Your gift for ' + esc(recipient()) + ' is in our hands. Our curator will choose their book and write their letter, and you\'ll receive a confirmation email shortly.</p>' +
'<div class="gift-actions"><a class="gift-btn gift-btn--main" href="/">Back to homepage</a></div>';
};
var SCREEN_IMAGES = {
relationship: RELATIONSHIPS.map(function (r) { return r[1]; }),
occasion: OCCASIONS.map(function (o) { return o[1]; }),
moods: MOODS.map(function (m) { return m[3]; }),
fuel: FUELS.map(function (f) { return f[1]; }),
checkout: SHOW_PRODUCT_IMAGE ? ['gift_box_product.jpg'] : []
};
function preloadAhead(screen) {
var next = screen;
for (var step = 0; step < 3 && next !== 'checkout' && next !== 'thank_you'; step++) {
next = next === 'uk' ? 'names' : nextAfter(next);
if (SCREEN_IMAGES[next]) preload(SCREEN_IMAGES[next]);
}
}
function render(isBack) {
var root = $('gift-screen');
root.className = 'gift-screen' + (isBack ? ' is-back' : '');
(screens[state.screen] || screens.uk)(root);
root.querySelectorAll('.gift-tile, .gift-card, .gift-tick, .gift-mood, .gift-stack > div, .gift-actions, .gift-offer, .gift-counter, .gift-link')
.forEach(function (el, i) { el.classList.add('gift-rise'); el.style.setProperty('--i', String(Math.min(i, 8))); });
revealImages(root);
updateChrome();
viewed(state.screen);
var title = root.querySelector('.gift-title');
if (title && state.history.length) title.focus({ preventScroll: true });
setTimeout(function () { preloadAhead(state.screen); }, 250);
}
var params = new URLSearchParams(location.search);
var returnStatus = params.get('status');
var returnGift = params.get('gift_id');
if (returnStatus && returnGift) {
if (returnGift !== state.gift_id) { state = freshState(); state.gift_id = returnGift; }
if (returnStatus === 'success') {
state.screen = 'thank_you'; state.history = []; state.paid = true;
var sessionId = params.get('session_id') || '';
(function confirm(attempt) {
fetch(API + '/gift/' + encodeURIComponent(returnGift) + '/confirm?session_id=' + encodeURIComponent(sessionId))
.then(function (response) { if (!response.ok && response.status >= 500 && attempt < 3) throw new Error('retry'); })
.catch(function () { if (attempt < 3) setTimeout(function () { confirm(attempt + 1); }, 2000 * (attempt + 1)); });
})(0);
queue = []; persistQueue();
} else {
state.screen = 'checkout';
if (state.history[state.history.length - 1] !== 'fuel') state.history.push('fuel');
}
persist();
try { history.replaceState(null, '', location.pathname); } catch (_) {}
}
if (state.gift_id) track.register({ gift_id: state.gift_id, reading_type: 'gift' });
else track.register({ reading_type: 'gift' });
render();
flush();
})();
</script>
