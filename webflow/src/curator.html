<script>
(function(){
  var BACKEND='https://soulbox-backend-new.vercel.app';
  var desks=[
    {curator:'Riya',house:'Body',image:'https://s3.amazonaws.com/webflow-prod-assets/68d100639551287fadcf87e3/6ab9d5742d1723dd3863d929_Rija%20(1).jpg',philosophy:'At our Desk, we focus on feeling a story. The emotional surge, the visceral experience, and the reaction to a narrative as opposed to just thinking through one.'},
    {curator:'Claire',house:'Heart',image:'https://s3.amazonaws.com/webflow-prod-assets/68d100639551287fadcf87e3/6ab9d574a677752c97b0c3d1_Claire%20(1).jpg',philosophy:'The focus is on human warmth and bonding, curating stories that speak directly to the depths of emotion and connection.'},
    {curator:'Lucas',house:'Mind',image:'https://s3.amazonaws.com/webflow-prod-assets/68d100639551287fadcf87e3/6ab9d574a6e9cc71527317df_Lucas.jpg',philosophy:'Using stories to stretch your mind, and selecting reads that expand your perspective. But most importantly, sinking fully into the narrative.'},
    {curator:'Ahmed',house:'Soul',image:'https://s3.amazonaws.com/webflow-prod-assets/68d100639551287fadcf87e3/6ab9d574e339f0ab7c6e40bb_Ahmed%20(1).jpg',philosophy:'We like our readers to find stories that are bigger than themselves, curating books that allow them to inhabit something that matches them on the deepest levels.'}
  ];
  function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
  document.body.innerHTML='<main class="desk-page"><section class="desk-shell"><h1>Enter Your House</h1><div class="desk-intro"><p>Only humans truly understand humans. Whether it is your Report, your physical SoulBox, or your ongoing Reading Relationship, every recommendation evolves as we get to know you.</p><p>Based on your quiz results, your Reading Desk has been chosen.</p></div><p class="portrait-credit"><em>Portraits illustrated by NishatArtz (@fiverr)</em></p><div class="desk-grid">'+desks.map(function(d){return '<article class="desk-card" data-curator="'+escapeHtml(d.curator)+'" data-house="'+escapeHtml(d.house)+'"><img src="'+d.image+'" alt="Illustrated portrait of '+escapeHtml(d.curator)+'"><span class="desk-name">'+'House of '+escapeHtml(d.house)+' Desk</span><span class="desk-role">Lead Curator - '+escapeHtml(d.curator)+'</span><span class="desk-philosophy">“'+escapeHtml(d.philosophy)+'”</span></article>'}).join('')+'</div><section class="promises" aria-label="House promises"><article><h2>Monthly Book Recommendations</h2><p>A personal book recommendation from your House curator every month.</p></article><article><h2>100% Human Touch</h2><p>Every report, email or letter is personally reviewed or written by our curators.</p></article><article><h2>House Community</h2><p>Monthly book clubs, House conversations and a community of readers like you.</p></article></section><form class="lead-form" id="lead-form" novalidate><h2>Complete Your Reading</h2><p id="selection-summary">Your profile will be saved and your House journey begins.</p><div class="form-grid"><label>First name<input id="first-name" name="firstName" type="text" autocomplete="given-name" maxlength="80" required></label><label>Email<input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="160" required></label><label>Country or region<select id="country" name="country" required><option value="">Select your country or region</option><option value="UK">UK</option><option value="US">US</option><option value="EU">EU</option><option value="Other">Other</option></select></label></div><button class="continue-button" id="continue-button" type="submit">Continue</button><p class="form-status" id="form-status" aria-live="polite"></p></form></section></main>';
  var style=document.createElement('style');
  style.textContent="html,body{margin:0;min-height:100%;background:#1c255d;color:#f4f2ec;font-family:'Source Serif Pro',Georgia,serif}*{box-sizing:border-box}.desk-page{min-height:100dvh;background:radial-gradient(circle at 50% 7%,rgba(73,92,169,.23),transparent 34%),linear-gradient(180deg,#222c68 0%,#141b43 100%);padding:56px 24px 72px}.desk-shell{width:min(100%,1080px);margin:0 auto;text-align:center}.desk-shell>h1{margin:0 0 24px;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(40px,6vw,64px);font-weight:500;line-height:1.05;letter-spacing:0}.desk-intro{max-width:760px;margin:0 auto;font-size:clamp(16px,2vw,18px);line-height:1.62;color:rgba(244,242,236,.86)}.desk-intro p{margin:0 0 16px}.portrait-credit{margin:22px auto 34px;font-size:14px;color:rgba(244,242,236,.65)}.desk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.desk-card{width:100%;min-height:420px;padding:26px 24px;border:1px solid rgba(244,242,236,.28);border-radius:8px;background:rgba(255,255,255,.035);color:#f4f2ec;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:default;transition:border-color .18s ease}.desk-card.is-match{order:-1;border-color:#d3af55;box-shadow:0 0 28px rgba(211,175,85,.28)}.desk-card.is-match:before{content:'Your House Desk';margin-bottom:13px;color:#e3c973;font-size:12px;text-transform:uppercase}.desk-card.is-selected{border-color:#f4f2ec;background:rgba(255,255,255,.09);box-shadow:0 0 28px rgba(244,242,236,.2)}.desk-card img{width:144px;height:144px;border-radius:50%;object-fit:cover;border:1px solid rgba(244,242,236,.3);margin-bottom:17px}.desk-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:31px;font-weight:600;line-height:1.1}.desk-role{margin-top:7px;font-size:15px;color:#d3af55}.desk-philosophy{max-width:390px;margin-top:18px;font-size:15px;line-height:1.55;font-style:italic;color:rgba(244,242,236,.76)}.promises{margin:42px 0 0;padding-top:36px;border-top:1px solid rgba(211,175,85,.35);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.promises article{padding:0 10px}.promises h2{margin:0 0 10px;font-family:'Cormorant Garamond',Georgia,serif;font-size:25px;font-weight:600}.promises p{margin:0;font-size:14px;line-height:1.55;color:rgba(244,242,236,.75)}.lead-form{display:block;width:min(100%,690px);margin:48px auto 0;padding:34px;border:1px solid rgba(244,242,236,.25);border-radius:8px;background:rgba(255,255,255,.04)}.lead-form.is-visible{display:block}.lead-form h2{margin:0 0 8px;font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;font-weight:500}.lead-form>p{margin:0 0 24px;color:rgba(244,242,236,.75)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left}.form-grid label{display:grid;gap:8px;font-size:14px}.form-grid input,.form-grid select{width:100%;height:50px;padding:11px 13px;border:1px solid rgba(244,242,236,.5);border-radius:6px;background:rgba(6,14,42,.58);color:#f4f2ec;font:16px 'Source Serif Pro',Georgia,serif;outline:none}.form-grid input:focus,.form-grid select:focus{border-color:#d3af55;box-shadow:0 0 0 3px rgba(211,175,85,.15)}.continue-button{min-height:52px;margin-top:22px;padding:13px 34px;border:1px solid #f4f2ec;border-radius:8px;background:#f4f2ec;color:#121a3f;font:700 17px 'Source Serif Pro',Georgia,serif;cursor:pointer}.continue-button:disabled{opacity:.58;cursor:wait}.form-status{min-height:22px!important;margin:14px 0 0!important;font-size:14px;color:#d3af55!important}@media(max-width:767px){.desk-page{padding:42px 18px 60px}.desk-grid{grid-template-columns:1fr}.desk-card{min-height:auto;padding:24px 18px}.promises{grid-template-columns:1fr;gap:24px}.lead-form{padding:28px 20px}.form-grid{grid-template-columns:1fr}}";
  document.head.appendChild(style);
  var font=document.createElement('link');font.rel='stylesheet';font.href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Source+Serif+Pro:wght@400;600;700&display=swap';document.head.appendChild(font);
  function readJSON(key){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return {}}}
  var quizState=readJSON('quizState');
  var result=readJSON('soulboxResult');
  result=quizState.result||result;
  var selected=desks.find(function(d){return d.house===result.house})||null;
  document.querySelectorAll('[data-house]').forEach(function(card){
    if(selected&&card.getAttribute('data-house')===selected.house)card.classList.add('is-match');
  });
  if(!selected){
    document.getElementById('continue-button').disabled=true;
    document.getElementById('form-status').textContent='Please complete your Soul Reading to find your House.';
  }else{
    quizState.chosen_curator={value:selected.curator,house:selected.house};
    localStorage.setItem('quizState',JSON.stringify(quizState));
  }
  var existing=readJSON('finalSubmission');
  var savedCountry=quizState.country||existing.country||'';
  document.getElementById('country').value=savedCountry.value||savedCountry;
  if(existing.name)document.getElementById('first-name').value=existing.name;
  if(existing.email)document.getElementById('email').value=existing.email;
  document.getElementById('lead-form').addEventListener('submit',function(event){
    event.preventDefault();
    var status=document.getElementById('form-status');
    var button=document.getElementById('continue-button');
    var name=document.getElementById('first-name').value.trim();
    var email=document.getElementById('email').value.trim();
    if(!selected){status.textContent='Please complete your Soul Reading to find your House.';return}
    if(!name){status.textContent='Enter your first name.';document.getElementById('first-name').focus();return}
    if(!document.getElementById('email').checkValidity()){status.textContent='Enter a valid email address.';document.getElementById('email').focus();return}
    var country=document.getElementById('country').value;
    if(!country){status.textContent='Select your country or region.';document.getElementById('country').focus();return}
    quizState=Object.assign({},existing,quizState);
    quizState.country=country;
    quizState.region=country;
    quizState.name=name.split(/\s+/)[0];
    quizState.email=email;
    quizState.chosen_curator={value:selected.curator,house:selected.house};
    button.disabled=true;status.textContent='Saving your reading…';
    fetch(BACKEND+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quizState:quizState})})
      .then(function(response){if(!response.ok)throw new Error('Unable to save your reading');return response.json()})
      .then(function(payload){
        if(!payload.ok)throw new Error(payload.error||'Unable to save your reading');
        quizState.result=payload.result;
        localStorage.setItem('quizState',JSON.stringify(quizState));
        localStorage.setItem('soulboxResult',JSON.stringify(payload.result));
        localStorage.setItem('finalSubmission',JSON.stringify(quizState));
        window.location.assign('/go-deeper');
      })
      .catch(function(error){console.error(error);status.textContent='We could not save your reading. Please check your connection and try again.';button.disabled=false});
  });
})();
</script>
