SOULBOX GIFT FLOW (Build Brief Part A)
Webflow: create a page at /gift and paste webflow/dist/gift.html into one Embed element.
Edit this source file, then run `node webflow/build.js`.

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{--gift-red:#8C1C2E;--gift-red-light:#9b2a3c;--cream:#f4f2ec;--beige:#F5E6D3;--gold:#B8902E}
  html,body{margin:0;min-height:100%;background:var(--gift-red)!important;color:var(--cream)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  .gift-app{width:min(100%,440px);margin:0 auto;min-height:100dvh;padding:18px 18px 48px;display:flex;flex-direction:column;font-family:'Source Serif Pro',Georgia,serif;color:var(--cream)}
  .gift-top{display:flex;align-items:center;min-height:44px;padding:0 6px;margin-bottom:18px}
  /* Back: a small pill that stays reachable at the bottom while long screens scroll. */
  .gift-foot{position:sticky;bottom:max(14px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;min-height:44px;margin-top:28px;pointer-events:none}
  .gift-back{pointer-events:auto;min-width:44px;min-height:44px;padding:10px 20px;border:1px solid rgba(245,230,211,.35);border-radius:22px;background:rgba(116,20,36,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.22);color:var(--cream);font:400 15px 'Source Serif Pro',Georgia,serif;letter-spacing:.02em;cursor:pointer;opacity:.92;transition:opacity .2s ease,background .2s ease,transform .2s ease}
  .gift-back:hover{opacity:1;background:rgba(116,20,36,.95);transform:translateY(-1px)}
  .gift-back.is-hidden{visibility:hidden}
  .gift-progress{position:relative;flex:1;height:2px;background:rgba(244,242,236,.35)}
  .gift-progress::before,.gift-progress::after{content:"";position:absolute;top:50%;width:10px;height:10px;border:2px solid var(--cream);border-radius:50%;transform:translateY(-50%);background:var(--gift-red)}
  .gift-progress::before{left:-5px}.gift-progress::after{right:-5px}
  .gift-progress-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--cream);box-shadow:0 0 10px rgba(244,242,236,.6);transition:width .35s ease}
  .gift-progress.is-hidden{visibility:hidden}
  .gift-screen{flex:1;display:flex;flex-direction:column;align-items:stretch;text-align:center;animation:giftEnter .5s cubic-bezier(.2,.7,.2,1) both}
  .gift-screen.is-leaving{opacity:0;transform:translateY(-8px);transition:opacity .18s ease,transform .18s ease;animation:none}
  .gift-screen.is-back{animation-name:giftEnterBack}
  .gift-rise{animation:giftRise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 45ms + 80ms)}
  @keyframes giftEnter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes giftEnterBack{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes giftRise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes giftPick{0%{transform:scale(1)}40%{transform:scale(.96)}75%{transform:scale(1.025)}100%{transform:scale(1)}}
  .gift-screen.is-centred{justify-content:center}
  .gift-title{font:500 30px/1.25 'Cormorant Garamond',Georgia,serif;margin:6px 0 10px;text-shadow:0 0 8px rgba(255,255,255,.2);outline:none}
  .gift-sub{font-style:italic;font-size:16px;line-height:1.5;margin:0 0 20px;opacity:.85}
  .gift-copy{font-size:18px;line-height:1.6;margin:0 0 30px}
  .gift-stack{display:grid;gap:12px;margin:14px 0 6px}
  .gift-actions{display:grid;gap:12px;margin-top:24px}
  @media(min-width:768px){.gift-actions.is-row{grid-template-columns:1fr 1fr}}
  .gift-btn{display:block;width:100%;min-height:50px;padding:12px 24px;border:2px solid rgba(255,255,255,.7);border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.1));color:var(--cream);font:400 16px 'Source Serif Pro',Georgia,serif;cursor:pointer;transition:box-shadow .2s ease,transform .2s ease,background .2s ease;text-decoration:none;text-align:center}
  .gift-btn:hover{box-shadow:0 0 12px rgba(255,255,255,.55);transform:translateY(-2px)}
  .gift-btn:disabled{opacity:.55;cursor:wait;transform:none;box-shadow:none}
  .gift-btn--main{background:var(--cream);border-color:var(--cream);color:var(--gift-red);font-weight:700}
  .gift-btn--outline{background:transparent;border-color:rgba(244,242,236,.7)}
  .gift-link{display:inline-block;min-height:44px;padding:12px;margin:8px auto 0;border:0;background:none;color:var(--cream);font:400 15px 'Source Serif Pro',Georgia,serif;text-decoration:underline;cursor:pointer;opacity:.85}
  .gift-field{display:block;width:100%;margin:0;padding:13px 14px;border:1px solid var(--beige);border-radius:8px;background:rgba(255,255,255,.06);color:var(--cream);font:400 16px/1.5 'Source Serif Pro',Georgia,serif;text-align:left}
  .gift-field::placeholder{color:rgba(244,242,236,.6)}
  .gift-field:focus{outline:none;border-color:var(--gold);box-shadow:0 0 10px rgba(184,144,46,.45)}
  textarea.gift-field{resize:none;overflow-y:auto;min-height:calc(1.5em * 5 + 28px)}
  textarea.gift-field.is-tall{min-height:calc(1.5em * 7 + 28px)}
  textarea.gift-field.is-short{min-height:calc(1.5em * 3 + 28px)}
  .gift-words{margin:8px 2px 0;font-size:14px;font-style:italic;text-align:left;opacity:.8;transition:opacity .2s ease,color .2s ease}
  .gift-words.is-good{opacity:1;color:var(--beige)}
  /* Welcome screen: a landscape hero photo, sized with the screen height so the
     whole screen fits without scrolling on phones and desktop. */
  .gift-hero{width:min(100%,calc(28vh * 778 / 596),420px);margin:0 auto 28px}
  .gift-hero .gift-media{aspect-ratio:778/596}
  .gift-hero .gift-media img{object-fit:cover}
  .gift-welcome-title{font-size:clamp(23px,6.4vw,30px);line-height:1.15;margin:0 0 20px}
  .gift-welcome-title span{display:block;white-space:nowrap}
  .gift-price{margin:0 0 10px;color:var(--cream);font-size:14px;font-style:italic;opacity:.9}
  .gift-btn--nowrap{white-space:nowrap}
  .gift-btn--welcome{width:70%;margin:0 auto}
  .gift-uk-note{margin:10px 0 0;font-size:13px;font-style:italic;opacity:.8}
  .gift-home-link{display:inline-block;min-height:44px;padding:10px 12px;margin:0 auto;color:var(--cream);font-size:15px;text-decoration:underline;opacity:.85}
  .gift-app.is-welcome .gift-top{display:none}
  /* Header images sit above the question, small enough that the form and Continue stay on screen. */
  .gift-header{width:min(100%,200px,26vh);margin:0 auto 16px}
  .gift-media.is-auto{aspect-ratio:16/9}
  .gift-media.is-auto:not(.is-loading){aspect-ratio:auto}
  .gift-media.is-auto:not(.is-loading) img{position:static;height:auto}
  .gift-welcome-copy{margin-bottom:28px;font-size:16px;line-height:1.5;text-wrap:balance}
  .gift-app.is-welcome{padding-top:14px;padding-bottom:14px}
  .gift-app.is-welcome .gift-foot{display:none}
  @media(max-height:600px){
    .gift-hero{width:min(100%,calc(24vh * 778 / 596));margin-bottom:20px}
    .gift-welcome-title{margin-bottom:14px}
    .gift-welcome-copy{font-size:15px;margin-bottom:20px}
    .gift-uk-note{margin-top:6px}
  }
  .gift-tick-other{margin-top:2px}
  .gift-error{margin:6px 2px 0;font-size:14px;font-style:italic;color:var(--cream);text-align:left}
  .gift-card{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:12px 18px;border:1.5px solid var(--beige);border-radius:8px;background:rgba(255,255,255,.05);color:var(--cream);font:400 16px/1.4 'Source Serif Pro',Georgia,serif;cursor:pointer;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
  .gift-card:hover{background:rgba(255,255,255,.1)}
  .gift-card.is-selected{border-color:var(--gold);box-shadow:0 0 14px rgba(184,144,46,.55);background:rgba(184,144,46,.12);animation:giftPick .35s ease both}
  .gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin:14px 0 6px}
  .gift-grid>.is-odd-last{grid-column:1/-1;justify-self:center;width:calc(50% - 7px)}
  .gift-tile{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;color:var(--cream);cursor:pointer;font:inherit;text-align:center}
  .gift-media{position:relative;display:block;width:100%;aspect-ratio:1/1;border:2px solid var(--beige);border-radius:14px;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;background:rgba(255,255,255,.06)}
  .gift-media.is-portrait{aspect-ratio:2/3}
  .gift-media::after{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(140,28,46,.17)}
  /* Soft shimmer while an image downloads; the image then fades and sharpens in. */
  .gift-media::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(245,230,211,.14) 50%,transparent 70%);background-size:220% 100%;opacity:0;transition:opacity .3s ease}
  .gift-media.is-loading::before{opacity:1;animation:giftShimmer 1.3s ease-in-out infinite}
  @keyframes giftShimmer{from{background-position:120% 0}to{background-position:-120% 0}}
  .gift-media img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;border-radius:12px;opacity:1;transform:none;filter:none;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.7,.2,1),filter .55s ease}
  .gift-media.is-loading img{opacity:0;transform:scale(1.04);filter:blur(10px)}
  .gift-placeholder{display:flex;align-items:center;justify-content:center;position:absolute;inset:0;padding:10px;font-size:11px;line-height:1.3;word-break:break-all;opacity:.55;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 10px,rgba(255,255,255,.08) 10px 20px)}
  .gift-tile:hover .gift-media{transform:translateY(-2px)}
  .gift-tile.is-selected .gift-media{border-color:var(--gold);box-shadow:0 0 16px rgba(184,144,46,.7);animation:giftPick .35s ease both}
  .gift-tile-title{font-size:15px;line-height:1.35}
  .gift-mood{display:flex;flex-direction:column;gap:6px;padding:4px;border-radius:16px;transition:box-shadow .3s ease}
  .gift-mood.is-missing{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(184,144,46,.5)}
  .gift-mood-title{margin:4px 0 0;font-weight:700;font-size:15px;line-height:1.3}
  .gift-mood-line{margin:0;font-style:italic;font-size:13px;line-height:1.35;opacity:.85}
  .gift-mood-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:auto;padding-top:4px}
  .gift-mood-choice{min-height:44px;padding:4px 2px;border:1px solid var(--beige);border-radius:6px;background:transparent;color:var(--cream);font:400 12px/1.15 'Source Serif Pro',Georgia,serif;cursor:pointer}
  .gift-mood-choice{transition:background .2s ease,color .2s ease,transform .15s ease}
  .gift-mood-choice:active{transform:scale(.95)}
  .gift-mood-choice.is-selected{background:var(--beige);color:var(--gift-red);font-weight:700}
  .gift-counter{margin:22px 0 0;font-size:14px;opacity:.8}
  .gift-ticks{display:grid;gap:12px;margin:14px 0 6px;text-align:left}
  .gift-tick{display:flex;align-items:center;gap:14px;min-height:54px;padding:12px 16px;border:1.5px solid var(--beige);border-radius:8px;background:rgba(255,255,255,.05);cursor:pointer;font-size:16px;line-height:1.4}
  .gift-tick input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--gold)}
  .gift-tick.is-checked{border-color:var(--gold)}
  .gift-offer{margin:10px 0 0;padding:30px clamp(20px,6vw,34px);border:1px solid rgba(244,242,236,.25);border-radius:12px;background:radial-gradient(circle at center,var(--gift-red-light),var(--gift-red));text-align:center}
  .gift-offer-image{display:block;width:100%;height:auto;margin:0 0 22px;border:2px solid var(--beige);border-radius:12px;object-fit:contain}
  .gift-offer h2{font:500 40px/1.1 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
  .gift-offer-price{font-size:26px;margin:0 0 16px}
  .gift-offer-tag{font-style:italic;font-size:16px;line-height:1.5;margin:0 0 22px}
  .gift-offer ul{list-style:none;padding:0;margin:0 0 22px;text-align:left;display:grid;gap:14px;line-height:1.5}
  .gift-offer li{position:relative;padding-left:22px}
  .gift-offer li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--beige)}
  .gift-offer li em{opacity:.8}
  .gift-offer-note{font-style:italic;font-size:15px;line-height:1.5;margin:0 0 8px}
  .gift-offer-small{font-style:italic;font-size:13px;line-height:1.5;margin:0 0 22px;opacity:.85}
  .gift-status{min-height:22px;margin:14px 0 0;font-size:14px;line-height:1.5}
  .gift-fade{animation:giftFade 1.6s ease-in-out infinite}
  @keyframes giftFade{0%,100%{opacity:.55}50%{opacity:1}}
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="gift-app" id="gift-app">
  <div class="gift-top">
    <div class="gift-progress" id="gift-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="gift-progress-fill" id="gift-progress-fill"></div></div>
  </div>
  <main class="gift-screen" id="gift-screen"></main>
  <nav class="gift-foot" aria-label="Gift steps">
    <button class="gift-back is-hidden" id="gift-back" type="button" aria-label="Go back one screen">← Back</button>
  </nav>
</div>

<script>
(function () {
  'use strict';

  // ── Settings (safe to edit) ──────────────────────────────────────────────
  var API = 'https://soulbox-backend-new.vercel.app/api';
  // Christmas line on the checkout card. Fill in the date, e.g. '15 December'. Empty hides the line.
  var CHRISTMAS_ORDER_BY = '16 December';
  var SHOW_PRODUCT_IMAGE = true; // gift_box_product.jpg at the top of the checkout card
  var IMAGES = window.SOULBOX_GIFT_IMAGES || {};
  var STATE_KEY = 'soulboxGift';
  var QUEUE_KEY = 'soulboxGiftQueue';
  var RESUME_HOURS = 48;

  // ── Content (spellings are the canonical saved values) ───────────────────
  var RELATIONSHIPS = [
    ['Lover', 'gift_rel_lover.jpg'], ['Best Friend', 'gift_rel_bestfriend.jpg'], ['Parent', 'gift_rel_parent.jpg'],
    ['Sibling', 'gift_rel_sibling.jpg'], ['Child', 'gift_rel_child.jpg'], ['Colleague', 'gift_rel_colleague.jpg']
  ];
  var OCCASIONS = [
    ['Birthday', 'gift_occ_birthday.jpg'], ['Christmas', 'gift_occ_christmas.jpg'], ["Valentine's", 'gift_occ_valentines.jpg'],
    ['A Hard Chapter', 'gift_occ_hardchapter.jpg'], ['New Chapter', 'gift_occ_newchapter.jpg'], ['Thank You', 'gift_occ_thankyou.jpg'],
    ['Just Because', 'gift_occ_justbecause.jpg']
  ];
  var MOODS = [
    ['mood_harrypotter', 'Harry Potter', 'Youthful magic & adventure', 'gift_mood_harrypotter.jpg'],
    ['mood_gameofthrones', 'A Game of Thrones', 'Epic fantasy & dangerous worlds', 'gift_mood_gameofthrones.jpg'],
    ['mood_prideprejudice', 'Pride and Prejudice', 'Classic romance & charm', 'gift_mood_prideprejudice.jpg'],
    ['mood_sherlock', 'The Adventures of Sherlock Holmes', 'Mystery & intrigue', 'gift_mood_sherlock.jpg'],
    ['mood_gonegirl', 'Gone Girl', 'Dark psychological thrills', 'gift_mood_gonegirl.jpg'],
    ['mood_shining', 'The Shining', 'Horror & creeping dread', 'gift_mood_shining.jpg'],
    ['mood_hungergames', 'The Hunger Games', 'Rebellion & survival', 'gift_mood_hungergames.jpg'],
    ['mood_jurassicpark', 'Jurassic Park', 'Spectacular adventure & science fiction', 'gift_mood_jurassicpark.jpg'],
    ['mood_hitchhikers', "The Hitchhiker's Guide to the Galaxy", 'Absurd humour & imagination', 'gift_mood_hitchhikers.jpg'],
    ['mood_gatsby', 'The Great Gatsby', 'Glamour, longing & tragedy', 'gift_mood_gatsby.jpg'],
    ['mood_ove', 'A Man Called Ove', 'Heartwarming & deeply human', 'gift_mood_ove.jpg'],
    ['mood_acotar', 'A Court of Thorns and Roses', 'Romantic fantasy & obsession', 'gift_mood_acotar.jpg']
  ];
  var MOOD_CHOICES = ['Loved it', 'Maybe', 'Not them'];
  var HARD_NOS = ['No heavy trauma or grief', 'No explicit spice', 'No gore or horror', 'No preachy self-help', 'Something else'];
  var HARD_NOS_OTHER = 'Something else'; // ticking it shows a text box, saved as hard_nos_other
  var LIFE_CHAPTERS = [
    ['Running on empty', 'gift_life_runningonempty.jpg'], ['Starting something new', 'gift_life_startingnew.jpg'],
    ['Thriving', 'gift_life_thriving.jpg'], ['Craving excitement', 'gift_life_cravingexcitement.jpg'],
    ['Steady as ever', 'gift_life_steady.jpg']
  ];
  var MEANING_MIN_WORDS = 20;
  var MEANING_GOOD_WORDS = 50;
  var FUELS = [
    ['Shortbread', 'gift_fuel_shortbread.jpg'], ['Dark Chocolate', 'gift_fuel_darkchocolate.jpg'],
    ['Candy Kittens', 'gift_fuel_candykittens.jpg'], ['Fudge', 'gift_fuel_fudge.jpg']
  ];
  var MEMORY_SCREENS = {
    memory_place: { title: 'A place only the two of you would remember, and why.', field: 'memory_place', placeholder: 'e.g. The café where we stayed until closing, the night everything changed…' },
    memory_joke: { title: 'A running joke you share.', field: 'memory_joke', placeholder: 'Tell us the joke, and how it started.' },
    memory_tribute: { title: '"If the world gets too loud, you are the person who…"', field: 'memory_tribute', placeholder: 'Finish the sentence in your own words.' }
  };

  // Screen id → tracking screen name (Logic & Data Spec 8.2).
  var SCREEN_NAMES = {
    uk: 'gift_uk_notice', names: 'gift_names', relationship: 'gift_relationship', occasion: 'gift_occasion',
    moods: 'gift_moods', loved_book: 'gift_loved_book', hard_nos: 'gift_hard_nos', life_chapter: 'gift_life_chapter',
    details: 'gift_details', meaning: 'gift_meaning', memory_choice: 'gift_memory_choice',
    memory_place: 'gift_memory_place', memory_joke: 'gift_memory_joke', memory_tribute: 'gift_memory_tribute',
    fuel: 'gift_fuel', checkout: 'gift_checkout', thank_you: 'gift_thank_you'
  };

  // ── Helpers ──────────────────────────────────────────────────────────────
  var track = window.SoulBoxTrack || { sourceRef: null, abVariant: null, visitorId: null, register: noop, screenView: noop, screenComplete: noop, milestone: noop };
  function noop() {}
  function $(id) { return document.getElementById(id); }
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function read(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; } }
  function write(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }
  // An image in its fixed-shape frame (so nothing jumps while it loads).
  // The first few on a screen load straight away; the rest as they scroll into view.
  function media(file, alt, opts) {
    opts = opts || {};
    var url = IMAGES[file];
    var frame = 'gift-media' + (opts.portrait ? ' is-portrait' : '') + (opts.auto ? ' is-auto' : '');
    if (!url) return '<span class="' + frame + '"><span class="gift-placeholder" role="img" aria-label="' + esc(alt) + '">' + esc(file) + '</span></span>';
    var eager = (opts.index || 0) < 4;
    return '<span class="' + frame + ' is-loading"><img src="' + esc(url) + '" alt="' + esc(alt) + '" decoding="async"' +
      (eager ? ' loading="eager" fetchpriority="high"' : ' loading="lazy"') + '></span>';
  }
  // Reveal each image once it has loaded (instantly if it was already downloaded).
  function revealImages(root) {
    root.querySelectorAll('.gift-media.is-loading img').forEach(function (img) {
      var frame = img.parentNode;
      function done() { frame.classList.remove('is-loading'); }
      if (img.complete && img.naturalWidth) { done(); return; }
      img.addEventListener('load', done, { once: true });
      img.addEventListener('error', done, { once: true });
    });
  }

  // Download upcoming screens' images in the background so they appear instantly.
  var preloaded = {};
  function preload(files) {
    files.forEach(function (file) {
      var url = IMAGES[file];
      if (!url || preloaded[url]) return;
      preloaded[url] = new Image();
      preloaded[url].decoding = 'async';
      preloaded[url].src = url;
    });
  }
  (function preconnect() {
    try {
      var link = document.createElement('link');
      link.rel = 'preconnect'; link.href = 'https://cdn.prod.website-files.com'; link.crossOrigin = 'anonymous';
      document.head.appendChild(link);
    } catch (_) {}
  })();
  function recipient() { return (state.answers.recipient_name || '').trim() || 'them'; }
  function gifter() { return (state.answers.gifter_name || '').trim(); }

  // ── State ────────────────────────────────────────────────────────────────
  function freshState() {
    return { v: 1, gift_id: null, answers: { hard_nos: [] }, screen: 'uk', history: [], updatedAt: Date.now(), seen: {} };
  }
  var state = read(STATE_KEY);
  if (!state || state.v !== 1 || state.paid || Date.now() - (state.updatedAt || 0) > RESUME_HOURS * 3600 * 1000) state = freshState();
  function persist() { state.updatedAt = Date.now(); write(STATE_KEY, state); }

  // ── Save queue: every answer is kept in the browser until the server has it ─
  var queue = read(QUEUE_KEY) || [];
  var flushing = null;
  var retryTimer = null;
  var failures = 0;

  function persistQueue() { write(QUEUE_KEY, queue); }

  function enqueue(item) {
    var last = queue[queue.length - 1];
    var lastIsSending = flushing && queue.length === 1;
    if (item.kind === 'update' && last && last.kind === 'update' && last.gift_id === item.gift_id && !lastIsSending) {
      Object.assign(last.answers, item.answers);
    } else {
      queue.push(item);
    }
    persistQueue();
    flush();
  }

  function send(item) {
    var url = item.kind === 'create' ? API + '/gift' : API + '/gift/' + encodeURIComponent(item.gift_id);
    var body = item.kind === 'create' ? item.body : { answers: item.answers };
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      keepalive: true
    }).then(function (response) {
      if (response.ok) return;
      var error = new Error('Save failed (' + response.status + ')');
      error.status = response.status;
      throw error;
    });
  }

  function flush() {
    if (flushing) return flushing;
    clearTimeout(retryTimer);
    flushing = (function next() {
      if (!queue.length) return Promise.resolve();
      var item = queue[0];
      return send(item).then(function () {
        queue.shift(); persistQueue(); failures = 0;
        return next();
      }, function (error) {
        if (error.status === 404 && item.kind === 'update') {
          // Row missing (e.g. create never arrived): create it first, then retry the answers.
          queue.unshift(createItem(item.gift_id)); persistQueue();
          return next();
        }
        if (error.status === 400 || error.status === 409) {
          console.error('[SoulBox gift] dropped a save the server refused:', error.message, item);
          queue.shift(); persistQueue();
          return next();
        }
        failures += 1;
        var delay = Math.min(1000 * Math.pow(2, failures - 1), 15000);
        retryTimer = setTimeout(flush, delay);
        throw error;
      });
    })().then(function () { flushing = null; }, function (error) { flushing = null; throw error; });
    flushing.catch(noop);
    return flushing;
  }

  // Wait until every queued answer is saved (used before checkout).
  function flushAll(attempts) {
    attempts = attempts || 0;
    return flush().then(function () {
      if (queue.length) return flushAll(attempts);
    }, function (error) {
      if (attempts >= 3) throw error;
      return new Promise(function (resolve) { setTimeout(resolve, 1000 * (attempts + 1)); }).then(function () { return flushAll(attempts + 1); });
    });
  }

  window.addEventListener('online', flush);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') flush(); });

  function createItem(id) {
    return { kind: 'create', gift_id: id, body: { gift_id: id, source_ref: track.sourceRef, ab_variant: track.abVariant, session_id: track.visitorId } };
  }
  function save(answers) {
    if (!state.gift_id) return;
    enqueue({ kind: 'update', gift_id: state.gift_id, answers: answers });
  }

  // ── Flow ─────────────────────────────────────────────────────────────────
  function flowSteps() {
    var steps = ['names', 'relationship', 'occasion', 'moods', 'loved_book', 'hard_nos', 'life_chapter', 'details', 'meaning', 'memory_choice'];
    if (state.answers.memory_cards === 'Yes') steps.push('memory_place', 'memory_joke', 'memory_tribute');
    steps.push('fuel');
    return steps;
  }
  function nextAfter(screen) {
    if (screen === 'memory_choice') return state.answers.memory_cards === 'Yes' ? 'memory_place' : 'fuel';
    if (screen === 'fuel') return 'checkout';
    var steps = flowSteps();
    var index = steps.indexOf(screen);
    return index === -1 ? 'checkout' : steps[index + 1] || 'checkout';
  }

  var locked = false;
  // Each forward step also adds a browser history entry, so the phone's back
  // gesture (or browser back) steps back one screen instead of leaving the flow.
  var browserDepth = 0;
  function go(screen, options) {
    options = options || {};
    var forward = !options.back && !options.replace && state.screen !== screen;
    if (forward) {
      state.history.push(state.screen);
      try { history.pushState({ soulboxGift: true }, ''); browserDepth += 1; } catch (_) {}
    }
    state.screen = screen;
    persist();
    var root = $('gift-screen');
    root.classList.add('is-leaving');
    setTimeout(function () {
      render(options.back);
      window.scrollTo(0, 0);
      locked = false;
    }, 180);
  }
  function complete(answers) {
    Object.assign(state.answers, answers);
    persist();
    save(answers);
    track.screenComplete(SCREEN_NAMES[state.screen], { gift_id: state.gift_id });
    var current = state.screen;
    go(nextAfter(current));
  }
  function stepBack() {
    if (!state.history.length) return;
    go(state.history.pop(), { back: true });
  }
  // The on-page Back button goes through browser history when it can, so both stay in step.
  $('gift-back').addEventListener('click', function () {
    if (locked || !state.history.length) return;
    if (browserDepth > 0) history.back(); else stepBack();
  });
  window.addEventListener('popstate', function () {
    if (browserDepth > 0) browserDepth -= 1;
    if (state.screen === 'thank_you' || !state.history.length) return;
    // Mid-transition: wait for it to finish, then step back.
    (function attempt() { if (locked) setTimeout(attempt, 120); else { locked = true; stepBack(); } })();
  });

  function updateChrome() {
    var screen = state.screen;
    $('gift-back').classList.toggle('is-hidden', screen === 'uk' || screen === 'thank_you' || !state.history.length);
    var steps = flowSteps();
    var index = steps.indexOf(screen);
    var pct = screen === 'uk' ? 0 : index === -1 ? 100 : Math.round(((index + 1) / steps.length) * 100);
    $('gift-progress-fill').style.width = pct + '%';
    $('gift-progress').setAttribute('aria-valuenow', String(pct));
    $('gift-progress').classList.toggle('is-hidden', screen === 'thank_you');
    // The welcome screen sells: no progress bar there.
    $('gift-app').classList.toggle('is-welcome', screen === 'uk');
  }

  function viewed(screen) {
    var name = SCREEN_NAMES[screen];
    track.screenView(name, { gift_id: state.gift_id });
    if (state.gift_id && screen !== 'thank_you') save({ last_screen_reached: name });
    if (screen === 'uk' && !state.seen.started) { state.seen.started = true; track.milestone('gift_started'); }
    if (screen === 'checkout' && !state.seen.checkout) { state.seen.checkout = true; track.milestone('gift_checkout_reached', { gift_id: state.gift_id }); }
    persist();
  }

  // Auto-advance after a single-choice tap: highlight, then move on after ~300ms.
  function choose(button, answers) {
    if (locked) return;
    locked = true;
    var group = button.parentNode.querySelectorAll('.is-selected');
    for (var i = 0; i < group.length; i++) group[i].classList.remove('is-selected');
    button.classList.add('is-selected');
    button.setAttribute('aria-pressed', 'true');
    setTimeout(function () { complete(answers); }, 300);
  }

  function showError(el, show) { if (el) el.hidden = !show; }

  // ── Screens ──────────────────────────────────────────────────────────────
  var screens = {};

      '<p class="gift-uk-note">UK delivery only</p>' +

    $('gift-uk-yes').addEventListener('click', function () {

  function wordCount(text) { return (String(text || '').trim().match(/\S+/g) || []).length; }
  // Live word-count message for a field with minWords (e.g. "What they mean").
  function wordMessage(count, min) {
    if (count < min) return 'Tell us a little more: at least ' + min + ' words.';
    if (count < MEANING_GOOD_WORDS) return 'Good, keep going if you can.';
    return 'Beautiful. This will make their letter.';
  }

      '<div class="gift-stack">' + opts.fields.map(function (f, i) {
        var value = esc(state.answers[f.field] || '');
        var size = f.tall ? ' is-tall' : f.short ? ' is-short' : '';
        var input = f.multi
          ? '<textarea class="gift-field' + size + '" id="gift-f' + i + '" aria-label="' + esc(f.label || opts.title) + '"' + (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + (f.minWords ? ' aria-describedby="gift-w' + i + '"' : '') + '>' + value + '</textarea>'
          : '<input class="gift-field" id="gift-f' + i + '" type="text" autocomplete="off" aria-label="' + esc(f.label || f.placeholder) + '" placeholder="' + esc(f.placeholder || '') + '" value="' + value + '">';
        return '<div>' + input +
          (f.minWords ? '<p class="gift-words" id="gift-w' + i + '" aria-live="polite"></p>' : '') +
          '<p class="gift-error" id="gift-e' + i + '" hidden>Please fill this in.</p></div>';
      }).join('') + '</div>' +
      '<div class="gift-actions"><button class="gift-btn" id="gift-continue" type="button">Continue</button></div>' +
      (opts.skip ? '<button class="gift-link" id="gift-skip" type="button">Skip</button>' : '');

    // Fields with a minimum word count keep Continue disabled until they reach it.
    function updateWords() {
      var allEnough = true;
      opts.fields.forEach(function (f, i) {
        if (!f.minWords) return;
        var count = wordCount($('gift-f' + i).value);
        var line = $('gift-w' + i);
        line.textContent = wordMessage(count, f.minWords);
        line.classList.toggle('is-good', count >= f.minWords);
        if (count < f.minWords) allEnough = false;
      });
      $('gift-continue').disabled = !allEnough;
    }

    opts.fields.forEach(function (f, i) {
      $('gift-f' + i).addEventListener('input', function (event) {
        state.answers[f.field] = event.target.value; persist();
        if (event.target.value.trim()) showError($('gift-e' + i), false);
        if (f.minWords) updateWords();
      });
    });
    if (opts.fields.some(function (f) { return f.minWords; })) updateWords();

    function submit(skipping) {
      if (locked) return;
      var answers = {}; var firstBad = null;
      opts.fields.forEach(function (f, i) {
        var value = skipping ? '' : $('gift-f' + i).value.trim();
        var bad = f.required && !value || f.minWords && wordCount(value) < f.minWords;
        showError($('gift-e' + i), f.required && !value);
        if (bad && firstBad === null) firstBad = i;
        answers[f.field] = value || null;
      });
      if (firstBad !== null) { $('gift-f' + firstBad).focus(); return; }
      locked = true;
      complete(answers);
    }
    $('gift-continue').addEventListener('click', function () { submit(false); });
    if (opts.skip) $('gift-skip').addEventListener('click', function () { submit(true); });
  }

  function imageScreen(root, opts) {

        var selected = state.answers[opts.field] === o[0];
        var odd = count % 2 === 1 && i === count - 1;
        return '<button class="gift-tile' + (selected ? ' is-selected' : '') + (odd ? ' is-odd-last' : '') + '" type="button" data-value="' + esc(o[0]) + '" aria-pressed="' + selected + '">' +
          media(o[1], o[0], { index: i }) + '<span class="gift-tile-title">' + esc(o[0]) + '</span></button>';
      }).join('') + '</div>';

      }).join('') + '</div>';
    root.querySelectorAll('.gift-card').forEach(function (button) {

      track.milestone('gift_buy_tapped', { gift_id: state.gift_id });
      flushAll().then(function () {
        return fetch(API + '/gift/' + encodeURIComponent(state.gift_id) + '/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      }).then(function (response) {
        return response.json().then(function (data) { return { response: response, data: data }; });
      }).then(function (result) {
        if (result.response.status === 400 && result.data.missing) throw new Error('missing');
        if (!result.response.ok || !result.data.url) throw new Error(result.data.error || 'Checkout is unavailable.');
        var url = new URL(result.data.url);
        if (url.protocol !== 'https:' || url.hostname !== 'checkout.stripe.com') throw new Error('Invalid checkout destination');
        track.screenComplete('gift_checkout', { gift_id: state.gift_id });
        window.location.assign(url.href);
      }).catch(function (error) {
        console.error('[SoulBox gift] checkout failed', error);
        button.disabled = false;
        status.textContent = error.message === 'missing'
          ? 'A few answers are missing. Please go back and check each screen.'
          : 'We could not open checkout. Please check your connection and try again.';
      });
    });
  };

  screens.thank_you = function (root) {
    root.classList.add('is-centred');
    var who = gifter();
    root.innerHTML =
      '<h1 class="gift-title" tabindex="-1">' + (who ? 'Thank you, ' + esc(who) + '.' : 'Thank you.') + '</h1>' +
      '<p class="gift-copy">Your gift for ' + esc(recipient()) + ' is in our hands. Our curator will choose their book and write their letter, and you\'ll receive a confirmation email shortly.</p>' +
      '<div class="gift-actions"><a class="gift-btn gift-btn--main" href="/">Back to homepage</a></div>';
  };

  // Images used by each screen, for background preloading.
  var SCREEN_IMAGES = {
    names: ['gift_names_header.jpg'],
    relationship: RELATIONSHIPS.map(function (r) { return r[1]; }),
    life_chapter: LIFE_CHAPTERS.map(function (l) { return l[1]; }),
    occasion: OCCASIONS.map(function (o) { return o[1]; }),
    moods: MOODS.map(function (m) { return m[3]; }),
    fuel: FUELS.map(function (f) { return f[1]; }),
    checkout: SHOW_PRODUCT_IMAGE ? ['gift_box_product.jpg'] : []
  };
  // Start downloading the images of the next three screens.
  function preloadAhead(screen) {
    var next = screen;
    for (var step = 0; step < 3 && next !== 'checkout' && next !== 'thank_you'; step++) {
      next = next === 'uk' ? 'names' : nextAfter(next);
      if (SCREEN_IMAGES[next]) preload(SCREEN_IMAGES[next]);
    }
  }

  function render(isBack) {
    var root = $('gift-screen');
    root.className = 'gift-screen' + (isBack ? ' is-back' : '');
    (screens[state.screen] || screens.uk)(root);
    // Cards, tiles, fields and buttons rise in one after another.
    root.querySelectorAll('.gift-tile, .gift-card, .gift-tick, .gift-mood, .gift-stack > div, .gift-actions, .gift-offer, .gift-counter, .gift-link')
      .forEach(function (el, i) { el.classList.add('gift-rise'); el.style.setProperty('--i', String(Math.min(i, 8))); });
    revealImages(root);
    updateChrome();
    viewed(state.screen);
    var title = root.querySelector('.gift-title');
    if (title && state.history.length) title.focus({ preventScroll: true });
    // Let the current screen's images go first, then fetch what's coming next.
    setTimeout(function () { preloadAhead(state.screen); }, 250);
  }

  // ── Returning from Stripe ────────────────────────────────────────────────
  var params = new URLSearchParams(location.search);
  var returnStatus = params.get('status');
  var returnGift = params.get('gift_id');
  if (returnStatus && returnGift) {
    if (returnGift !== state.gift_id) { state = freshState(); state.gift_id = returnGift; }
    if (returnStatus === 'success') {
      state.screen = 'thank_you'; state.history = []; state.paid = true;
      var sessionId = params.get('session_id') || '';
      (function confirm(attempt) {
        fetch(API + '/gift/' + encodeURIComponent(returnGift) + '/confirm?session_id=' + encodeURIComponent(sessionId))
          .then(function (response) { if (!response.ok && response.status >= 500 && attempt < 3) throw new Error('retry'); })
          .catch(function () { if (attempt < 3) setTimeout(function () { confirm(attempt + 1); }, 2000 * (attempt + 1)); });
      })(0);
      queue = []; persistQueue();
    } else {
      state.screen = 'checkout';
      if (state.history[state.history.length - 1] !== 'fuel') state.history.push('fuel');
    }
    persist();
    try { history.replaceState(null, '', location.pathname); } catch (_) {}
  }

  if (state.gift_id) track.register({ gift_id: state.gift_id, reading_type: 'gift' });
  else track.register({ reading_type: 'gift' });
  render();
  flush();
})();
</script>
