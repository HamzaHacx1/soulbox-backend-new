  screen('whisper', { name: 'whisper', when: isFull, render: function (root) {
    var q = LEGACY.whisper;
    textChoice(root, { title: q.prompt, options: q.options.map(function (o) { return [o.text || o.label, o.value]; }), selected: state.legacy[q.id],
      onPick: function (value) { var l = {}; l[q.id] = value; save(null, l); } });
  } });
  screen('one_issue', { name: 'one_issue', when: isFull, render: function (root) {
    var q = LEGACY.one_issue;
    writeScreen(root, { image: q.image, title: q.prompt, value: state.legacy[q.id], multi: false, placeholder: q.placeholder || '',
      onDone: function (value) { var l = {}; l[q.id] = value; save(null, l); } });
  } });
  screen('childhood', { name: 'childhood', when: isFull, render: function (root) { legacyButtons(root, LEGACY.childhood); } });
  ['prologue', 'first_law', 'shortage', 'betrayal', 'epilogue'].forEach(function (key) {
    screen('eden_' + key, { name: 'eden_' + key, when: isFull, render: function (root) {
      var e = EDEN[key];
      story(root, { image: e.image, text: e.text, extra: e.extra, question: e.question,
        write: e.field && { value: a()[e.field], minWords: EDEN_MIN_WORDS, placeholder: 'Write what you\'d actually do. There\'s no right answer.',
          onDone: function (value) { var c = {}; c[e.field] = value; save(c); } } });
    } });
  });
  // H4: The Image (four visions) and last words, unchanged
  screen('image', { name: 'image', when: isFull, render: function (root) {
    var q = LEGACY.image;
    imageChoice(root, { title: q.prompt || '', options: q.options.map(function (o) { return { label: o.label, value: o.value, file: o.imageId, caption: o.text }; }),
      selected: state.legacy[q.id], shape: 'landscape', showLabels: true, onPick: function (o) { var l = {}; l[q.id] = o.value; delete state.legacy[LEGACY.last_words.id]; save(null, l); } });
  } });
  screen('last_words', { name: 'last_words', when: isFull, render: function (root) {
    var q = LEGACY.last_words, cluster = state.legacy[LEGACY.image.id];
    story(root, { image: q.image, text: q.storyText, options: (q.dynamicOptions[cluster] || []).map(function (o) { return [o.label, o.value]; }),
      selected: state.legacy[q.id], onPick: function (value) { var l = {}; l[q.id] = value; save(null, l); track.milestone('full2_complete'); } });
  } });

  // Part I: Three Last Questions
  screen('final_intro', { name: 'final_intro', when: isFull, render: function (root) { intro(root, null, 'Three Last Questions', 'And your curator will truly know you.'); } });
  Object.keys(FINAL).forEach(function (field, n) {
    screen(field, { name: field, when: isFull, render: function (root) {
      writeScreen(root, { title: FINAL[field], question: true, value: a()[field], multi: true, placeholder: 'Take your time.', onDone: function (value) {
        var c = {}; c[field] = value;
        if (n === 2) { c.full_reading_completed = 'yes'; track.milestone('full_reading_complete'); }
        save(c);
      } });
    } });
  });

  // Results and everything after them (Parts J to L)
  screen('results', { name: 'results_intro', render: function (root) {
    if (window.SoulBoxResults) window.SoulBoxResults.render(root);
    else root.innerHTML = '<p class="q-copy">Your results are ready.</p>';
  } });

  // ── Screen building blocks ───────────────────────────────────────────────
  function markSelected(root, selector, value, attr) {
    if (value == null) return;
    root.querySelectorAll(selector).forEach(function (el) { if (el.getAttribute('data-' + attr) === String(value)) el.classList.add('is-selected'); });
  }
  function intro(root, label, headline, line) {
    root.classList.add('is-centred');
    root.innerHTML = (label ? '<p class="q-label">' + esc(label) + '</p>' : '') + '<h1 class="q-title is-large" tabindex="-1">' + esc(headline) + '</h1>' +
      (line ? '<p class="q-sub">' + esc(line) + '</p>' : '') + '<div class="q-actions"><button class="q-btn" id="q-continue" type="button">Continue</button></div>';
    $('q-continue').addEventListener('click', function () { complete(noop); });
  }
  function textChoice(root, opts) {
    root.innerHTML = '<h1 class="q-title" tabindex="-1">' + esc(opts.title) + '</h1><div class="q-stack">' +
      opts.options.map(function (o) { return '<button class="q-card" type="button" data-value="' + esc(o[1]) + '">' + esc(o[0]) + '</button>'; }).join('') + '</div>';
    markSelected(root, '[data-value]', opts.selected, 'value');
    root.querySelectorAll('[data-value]').forEach(function (b) { b.addEventListener('click', function () { choose(b, function () { opts.onPick(b.getAttribute('data-value')); }); }); });
  }
  function imageChoice(root, opts) {
    var count = opts.options.length;
    root.innerHTML = (opts.title ? '<h1 class="q-title" tabindex="-1">' + esc(opts.title) + '</h1>' : '') + '<div class="q-grid">' +
      opts.options.map(function (o, i) {
        var odd = count % 2 === 1 && i === count - 1;
        return '<button class="q-tile' + (odd ? ' is-odd-last' : '') + '" type="button" data-value="' + esc(o.value) + '" aria-label="' + esc(o.label) + '">' +
          media(o.file, o.label, { shape: opts.shape, index: i, tint: true }) +
          (opts.showLabels ? '<span class="q-tile-title">' + esc(o.label) + '</span>' : '') +
          (o.caption ? '<span class="q-tile-caption">' + esc(o.caption) + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    markSelected(root, '[data-value]', opts.selected, 'value');
    root.querySelectorAll('[data-value]').forEach(function (b) { b.addEventListener('click', function () {
      var value = b.getAttribute('data-value'), option = opts.options.filter(function (o) { return String(o.value) === value; })[0];
      choose(b, function () { opts.onPick(option); });
    }); });
  }
  // Existing "button" questions (storytellers, childhood): image, prompt, text cards.
  function legacyButtons(root, q) {
    root.innerHTML = (q.image ? '<div class="q-hero">' + media(q.image, '', { shape: 'landscape', cover: true }) + '</div>' : '') +
      '<h1 class="q-title" tabindex="-1">' + esc(q.prompt) + '</h1><div class="q-stack">' +
      q.buttons.map(function (o) { return '<button class="q-card" type="button" data-value="' + esc(o.value) + '">' + esc(o.label) + '</button>'; }).join('') + '</div>';
    markSelected(root, '[data-value]', state.legacy[q.id], 'value');
    root.querySelectorAll('[data-value]').forEach(function (b) { b.addEventListener('click', function () {
      choose(b, function () { var l = {}; l[q.id] = b.getAttribute('data-value'); save(null, l); });
    }); });
  }
  // Story screen (Type 5): landscape image, text, then Continue, answer cards, or a written answer.
  function story(root, opts) {
    root.innerHTML = '<div class="q-hero">' + media(opts.image, '', { shape: 'landscape', cover: true, index: 0 }) + '</div>' +
      '<p class="q-story">' + esc(opts.text) + '</p>' +
      (opts.extra ? '<p class="q-story-extra">' + esc(opts.extra) + '</p>' : '') +
      (opts.question ? '<p class="q-story-question">' + esc(opts.question) + '</p>' : '') +
      (opts.options ? '<div class="q-stack">' + opts.options.map(function (o) { return '<button class="q-card" type="button" data-value="' + esc(o[1]) + '">' + esc(o[0]) + '</button>'; }).join('') + '</div>' : '') +
      (opts.write ? '<div class="q-stack"><div><textarea class="q-field" id="q-text" aria-label="Your answer" placeholder="' + esc(opts.write.placeholder) + '">' + esc(opts.write.value || '') + '</textarea><p class="q-error" id="q-err" hidden></p></div></div>' : '') +
      (!opts.options ? '<div class="q-actions"><button class="q-btn" id="q-continue" type="button">Continue</button></div>' : '');
    if (opts.options) {
      markSelected(root, '[data-value]', opts.selected, 'value');
      root.querySelectorAll('[data-value]').forEach(function (b) { b.addEventListener('click', function () { choose(b, function () { opts.onPick(b.getAttribute('data-value')); }); }); });
      return;
    }
    $('q-continue').addEventListener('click', function () {
      if (!opts.write) return complete(noop);
      var value = $('q-text').value.trim(), err = $('q-err');
      if (!value) { err.textContent = 'Please fill this in.'; err.hidden = false; return; }
      if (wordCount(value) < opts.write.minWords) { err.textContent = 'Tell us a little more: at least ' + opts.write.minWords + ' words.'; err.hidden = false; return; }
      complete(function () { opts.write.onDone(value); });
    });
  }
  // Text answer screen (Type 6a / 6b).
  function writeScreen(root, opts) {
    root.innerHTML = (opts.image ? '<div class="q-hero">' + media(opts.image, '', { shape: 'landscape', cover: true }) + '</div>' : '') +
      '<h1 class="q-title' + (opts.question ? ' is-question' : '') + '" tabindex="-1">' + esc(opts.title) + '</h1><div class="q-stack"><div>' +
      (opts.multi ? '<textarea class="q-field" id="q-text" aria-label="Your answer" placeholder="' + esc(opts.placeholder) + '">' + esc(opts.value || '') + '</textarea>'
        : '<input class="q-field" id="q-text" type="text" autocomplete="off" aria-label="Your answer" placeholder="' + esc(opts.placeholder) + '" value="' + esc(opts.value || '') + '">') +
      '<p class="q-error" id="q-err" hidden>Please fill this in.</p></div></div><div class="q-actions"><button class="q-btn" id="q-continue" type="button">Continue</button></div>';
    $('q-continue').addEventListener('click', function () {
      var value = $('q-text').value.trim();
      if (!value) { $('q-err').hidden = false; return; }
      complete(function () { opts.onDone(value); });
    });
  }
  function triggersScreen(root) {
    var q = LEGACY.triggers, chosen = state.legacy[q.id] || [];
    var options = q.options.map(function (o) { return o.value || o; }).concat([TRIGGERS_OTHER]);
    root.innerHTML = '<h1 class="q-title" tabindex="-1">' + esc(q.prompt) + '</h1><div class="q-ticks">' +
      options.map(function (v, i) { var on = chosen.indexOf(v) !== -1; return '<label class="q-tick' + (on ? ' is-checked' : '') + '"><input type="checkbox" id="q-t' + i + '"' + (on ? ' checked' : '') + '><span>' + esc(v) + '</span></label>'; }).join('') +
      '<input class="q-field" id="q-other" type="text" autocomplete="off" aria-label="Tell us more" placeholder="Tell us more" value="' + esc(a().triggers_other || '') + '"' + (chosen.indexOf(TRIGGERS_OTHER) === -1 ? ' hidden' : '') + '>' +
      '</div><div class="q-actions"><button class="q-btn" id="q-continue" type="button">Continue</button></div>';
    var otherIndex = options.length - 1;
    function current() { return options.filter(function (_, i) { return $('q-t' + i).checked; }); }
    options.forEach(function (_, i) { $('q-t' + i).addEventListener('change', function (e) {
      e.target.parentNode.classList.toggle('is-checked', e.target.checked);
      if (i === otherIndex) { $('q-other').hidden = !e.target.checked; if (e.target.checked) $('q-other').focus(); else $('q-other').value = ''; }
    }); });
    $('q-continue').addEventListener('click', function () {
      var list = current(), other = list.indexOf(TRIGGERS_OTHER) !== -1 ? $('q-other').value.trim() : '';
      complete(function () { var l = {}; l[q.id] = list; save({ triggers_other: other || null }, l); track.milestone('full1_complete'); });
    });
  }
  // G2: one book per screen. Buttons only; the book slides out left, the next slides in right.
  function swipeScreen(root, n, field) {
    var deck = state.deck || [], book = deck[n];
    if (!book) { root.innerHTML = '<p class="q-copy">Your books are still loading.</p>'; return; }
    var saved = a()[field], savedAnswer = saved && saved.split(' | ').pop();
    root.innerHTML = '<p class="q-counter">' + (n + 1) + ' of 12</p>' +
      '<div class="q-book">' + media(book.image, book.title, { shape: 'portrait', index: 0 }) + '</div>' +
      '<p class="q-book-title">' + esc(book.title) + '</p><p class="q-book-author">' + esc(book.author) + '</p><p class="q-book-hook">' + esc(book.hook) + '</p>' +
      '<div class="q-swipe-grid">' + SWIPE_ANSWERS.reduce(function (all, row) { return all.concat(row); }, []).map(function (ans) {
        return '<button class="q-card" type="button" data-value="' + esc(ans) + '">' + esc(ans) + '</button>'; }).join('') + '</div>';
    markSelected(root, '[data-value]', savedAnswer, 'value');
    if (deck[n + 1]) preload([deck[n + 1].image]);
    root.querySelectorAll('[data-value]').forEach(function (b) { b.addEventListener('click', function () {
      choose(b, function () { var c = { swipe_deck: state.a.final_archetype || (state.results && state.results.final_archetype) }; c[field] = L.swipeValue(book, b.getAttribute('data-value')); save(c); }, { swipe: true });
    }); });
  }

  // ── Navigation ───────────────────────────────────────────────────────────
  var locked = false, browserDepth = 0;
  function go(id, options) {
    options = options || {};
    var forward = !options.back && !options.replace && state.screen !== id;
    if (forward) { state.history.push(state.screen); try { history.pushState({ soulboxQuiz: true }, ''); browserDepth += 1; } catch (_) {} }
    state.screen = id; persist();
    var root = $('q-screen');
    root.classList.add(options.swipe ? 'is-swipe-out' : 'is-leaving');
    setTimeout(function () { render(options.back, options.swipe); window.scrollTo(0, 0); locked = false; }, options.swipe ? 260 : 180);
  }
  // A completed screen: save, then move to the next visible screen.
  function complete(saveFn, options) {
    var from = state.screen;
    saveFn();
    track.screenComplete(screenName(from), { reader_id: state.reader_id });
    var next = nextAfter(from);
    if (from === 'masks_black') next = 'loading';
    if (from === 'final_rejection') next = 'results';
    go(next || 'results', options);
  }
  function choose(button, saveFn, options) {
    if (locked) return; locked = true;
    var group = button.parentNode.querySelectorAll('.is-selected');
    for (var i = 0; i < group.length; i++) group[i].classList.remove('is-selected');
    button.classList.add('is-selected');
    setTimeout(function () { complete(saveFn, options); }, 300);
  }
  function stepBack() { if (state.history.length) go(state.history.pop(), { back: true }); }
  $('q-back').addEventListener('click', function () { if (locked || !state.history.length) return; if (browserDepth > 0) history.back(); else { locked = true; stepBack(); } });
  window.addEventListener('popstate', function () {
    if (browserDepth > 0) browserDepth -= 1;
    if (!state.history.length || NO_BACK[state.screen]) return;
    (function attempt() { if (locked) setTimeout(attempt, 120); else { locked = true; stepBack(); } })();
  });
  var NO_BACK = { choice: true, loading: true, results: true, not_found: true };

  // ── Progress (0.5): Quick fills to the Black; Full fills to the last question, Masks at about 50% ──
  function updateChrome() {
    var id = state.screen;
    var f = flow().filter(function (s) { return s !== 'loading' && s !== 'results'; });
    var start = f.indexOf('doors'), i = f.indexOf(id);
    var pct = id === 'choice' ? 0 : i === -1 ? 100 : Math.round((Math.max(0, i - start) / Math.max(1, f.length - 1 - start)) * 100);
    $('q-progress-fill').style.width = pct + '%';
    $('q-progress').setAttribute('aria-valuenow', String(pct));
    $('q-progress').classList.toggle('is-hidden', id === 'results' || id === 'loading' || id === 'not_found');
    $('q-back').classList.toggle('is-hidden', !state.history.length || !!NO_BACK[id] || state.history[state.history.length - 1] === 'loading');
    $('q-app').classList.toggle('is-wide', !!S[id] && !!S[id].wide);
  }

  function render(isBack, isSwipe) {
    var root = $('q-screen');
    root.className = 'q-screen' + (isSwipe ? ' is-swipe-in' : isBack ? ' is-back' : '');
    (S[state.screen] || S.choice).render(root);
    root.querySelectorAll('.q-tile, .q-card, .q-tick, .q-stack > div, .q-actions, .q-passage, .q-story, .q-note').forEach(function (el, i) {
      if (isSwipe) return; el.classList.add('q-rise'); el.style.setProperty('--i', String(Math.min(i, 8)));
    });
    revealImages(root);
    updateChrome();
    var name = screenName(state.screen);
    track.screenView(name, { reader_id: state.reader_id });
    if (state.reader_id && state.screen !== 'loading') save({ last_screen_reached: name });
    if (state.screen === 'choice' && !state.seen.started) { state.seen.started = true; track.milestone('reading_started'); persist(); }
    var title = root.querySelector('.q-title'); if (title && state.history.length) title.focus({ preventScroll: true });
    setTimeout(function () { var n = nextAfter(state.screen); if (n && S[n].images) preload(S[n].images()); }, 250);
  }

  // Background preloading of the next screen's images
  S.doors.images = function () { return DOORS.map(function (d) { return d.file; }); };
  S.mystery.images = function () { return MYSTERY.map(function (m) { return m[1]; }); };
  S.gate_2.images = function () { return (GATE_2[a().gate_1] || []).map(function (o) { return o[1]; }); };
  ['prologue', 'silver', 'gold', 'black'].forEach(function (k) { S['masks_' + k].images = function () { return [MASKS[k].image]; }; });
  ['prologue', 'first_law', 'shortage', 'betrayal', 'epilogue'].forEach(function (k) { S['eden_' + k].images = function () { return [EDEN[k].image]; }; });

  // ── Results (calculated on the server from the saved answers) ────────────
  function fetchResults() {
    return flushAll().then(function () {
      return fetch(API + '/reader/' + encodeURIComponent(state.reader_id) + '/results', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Results unavailable'); return d; }); })
      .then(function (d) { state.results = d.results; state.deck = d.swipe_deck; state.a.final_archetype = d.results.final_archetype; persist(); return d; });
  }

  // ── Part M: the "Finish your reading" link (?id=) ────────────────────────
  var params = new URLSearchParams(location.search);
  var linkId = params.get('id');
  function startFromLink(id) {
    $('q-screen').innerHTML = '<p class="q-loading" role="status">Finding your reading…</p>';
    fetch(API + '/reader/' + encodeURIComponent(id)).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (res) {
      if (!res.ok || !res.d.results) throw new Error('not found');
      var keep = state.reader_id === id ? state : freshState();
      keep.reader_id = id; keep.results = res.d.results; keep.deck = res.d.swipe_deck;
      keep.a.final_archetype = res.d.results.final_archetype; keep.a.reading_type = 'full';
      keep.history = [];
      keep.screen = res.d.full_reading_completed === 'yes' ? 'results' : (keep.reader_id === id && S[keep.screen] && keep.screen !== 'results' && flow().indexOf(keep.screen) > flow().indexOf('full1_intro') ? keep.screen : 'full1_intro');
      state = keep; persist();
      // The upgrade to a Full Reading is saved on the same row.
      enqueue({ kind: 'update', reader_id: id, answers: { reading_type: 'full' } });
      track.register({ reader_id: id, reading_type: 'full' });
      try { history.replaceState(null, '', location.pathname); } catch (_) {}
      render();
    }).catch(function () {
      state.screen = 'not_found'; render();
    });
  }
  screen('not_found', { name: 'not_found', when: function () { return false; }, render: function (root) {
    root.classList.add('is-centred');
    root.innerHTML = '<h1 class="q-title" tabindex="-1">We couldn\'t find your reading.</h1><div class="q-actions"><button class="q-btn q-btn--main" id="q-new" type="button">Start a new reading</button></div>';
    $('q-new').addEventListener('click', function () { state = freshState(); queue = []; persistQueue(); persist(); try { history.replaceState(null, '', location.pathname); } catch (_) {} render(); });
  } });

  // Expose a little for the results module and for tests.
  window.SoulBoxQuiz = { state: function () { return state; }, save: save, go: go, flushAll: flushAll, api: API, media: media, esc: esc, imageUrl: imageUrl, revealImages: revealImages, track: track, persist: persist };

  track.register({ reading_type: a().reading_type || null, reader_id: state.reader_id || null });
  if (linkId) startFromLink(linkId); else render();
  flush();
})();
</script>
