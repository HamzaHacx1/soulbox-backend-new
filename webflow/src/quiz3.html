            options = question.dynamicOptions[getStateValue('yearning.cluster_image')];
            if (!options || options.length === 0) {
              options = [{ value: 'error', label: 'Error: No options available', imageId: 'error', disabled: true }];
            }
            question.gridType = options.length === 2 ? 'grid-2x1' : 'grid-2x2';
          }

          const container = document.getElementById('quiz-container');
          let imageHTML = '';
          if (question.id === 'yearning.cluster_image') {
            imageHTML = '';
          } else if (question.id === 'yearning.final') {
            imageHTML = question.image ? `<img src="${question.image}" alt="Scenario Image" class="scenario-image" loading="lazy">` : '';
          } else {
            imageHTML = question.image ? `<img src="${question.image}" alt="Scenario Image" class="scenario-image" loading="lazy">` : '';
          }

          container.innerHTML = `
            ${question.id === 'yearning.final' ? '<h1 class="subhead">Final Words.</h1>' : ''}
            ${imageHTML}
            <h1>${question.prompt}</h1>
            ${question.description ? `<p class="description">${question.description}</p>` : ''}
            ${question.storyText ? `<p class="story-text">${question.storyText}</p>` : ''}
            ${question.id === 'yearning.cluster_image' ? '<h1 class="subhead">The Image.</h1>' : ''}
            <div class="${question.gridType || 'grid-2x2'}">
              ${options.map(opt => `
                <div style="display: flex; flex-direction: column; align-items: center;">
                  ${question.id === 'yearning.cluster_image' ? `
                    <div class="image-tile" data-internal-value="${opt.value}" data-image-id="${opt.imageId || ''}" onclick="saveAnswer('${opt.value}', '${opt.label}', '${opt.imageId || ''}')">
                      <img src="${opt.imageId}" alt="${opt.label}" loading="lazy">
                    </div>
                    <p class="option-text">${opt.text || opt.label || opt.value}</p>
                  ` : `
                    <button class="scenario-button ${opt.disabled ? 'disabled' : ''}" data-internal-value="${opt.value}" data-image-id="${opt.imageId || ''}" onclick="${opt.disabled ? '' : `saveAnswer('${opt.value}', '${opt.label}', '${opt.imageId || ''}')`}" ${opt.disabled ? 'disabled' : ''}>
                      ${opt.label || opt.value}
                    </button>
                  `}
                </div>
              `).join('')}
            </div>
          `;
          container.classList.add('active');
          log('Rendered grid question', { questionId: question.id, gridType: question.gridType, options: options.map(opt => opt.value) });

        } catch (error) {
          log('Error rendering question', { error: error.message, questionIndex: currentQuestion });
          console.error('Error rendering question:', error);
          document.getElementById('quiz-container').innerHTML = '<p class="error-message">Error: Unable to load question. Please try again.</p>';
        }
      }

      function showTransitionScreen() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = `
          <div class="completion-screen">
            <h1>Final questions…</h1>
          </div>
        `;
        log('Showing transition screen');
        return new Promise(resolve => setTimeout(resolve, 1500));
      }

      async function saveAnswer(value, label = '', imageId = '') {
        try {
          if (!value && questions[currentQuestion].type !== 'story') {
            log('No answer selected', { questionId: questions[currentQuestion].id });
            document.getElementById('quiz-container').innerHTML += '<p class="error-message">Please select an option.</p>';
            return;
          }

          const questionId = questions[currentQuestion].id;
          if (questionId !== 'yearning.preface') {
            const keys = questionId.split('.');
            let target = state;
            for (let i = 0; i < keys.length - 1; i++) {
              target[keys[i]] = target[keys[i]] || {};
              target = target[keys[i]];
            }
            target[keys[keys.length - 1]] = { value, label, imageId };
            if (questionId === 'yearning.final') {
              state.yearning.whisper_confirm = { value, label, imageId };
              document.getElementById('milestone3').classList.add('glow');
              log('Saved yearning.final answer and set milestone3 glow', { value, label, imageId });
              await showTransitionScreen();
            }
            localStorage.setItem('quizState', JSON.stringify(state));
            log('Saved answer', { questionId, value, label, imageId });
          } else {
            log('Skipped saving for story question', { questionId });
          }

          selectedAnswer = null;
          setTimeout(async () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
              log('Advancing to next question', { nextQuestionIndex: currentQuestion, nextQuestionId: questions[currentQuestion]?.id });
              renderQuestion();
            } else {
              log('Quiz completed, showing completion screen');
              await showCompletionScreen();
            }
          }, 240);
        } catch (error) {
          log('Error saving answer', { error: error.message, questionId, value, label });
          console.error('Error saving answer:', error);
          document.getElementById('quiz-container').innerHTML = '<p class="error-message">Error: Unable to save answer. Please try again.</p>';
        }
      }

      function saveTextAnswer() {
        try {
          const input = document.getElementById('text-input').value.trim();
          if (!input) {
            log('No text input provided', { questionId: questions[currentQuestion].id });
            document.getElementById('quiz-container').innerHTML += '<p class="error-message">Please enter a response.</p>';
            return;
          }
          const questionId = questions[currentQuestion].id;
          const keys = questionId.split('.');
          let target = state;
          for (let i = 0; i < keys.length - 1; i++) {
            target[keys[i]] = target[keys[i]] || {};
            target = target[keys[i]];
          }
          target[keys[keys.length - 1]] = input;
          localStorage.setItem('quizState', JSON.stringify(state));
          log('Saved text answer', { questionId, input });

          currentQuestion++;
          if (currentQuestion < questions.length) {
            log('Advancing to next question', { nextQuestionIndex: currentQuestion, nextQuestionId: questions[currentQuestion]?.id });
            renderQuestion();
          } else {
            log('Quiz completed, showing completion screen');
            showCompletionScreen();
          }
        } catch (error) {
          log('Error saving text answer', { error: error.message, questionId });
          console.error('Error saving text answer:', error);
          document.getElementById('quiz-container').innerHTML = '<p class="error-message">Error: Unable to save answer. Please try again.</p>';
        }
      }

      function saveCheckboxAnswer() {
        try {
          const selected = Array.from(document.querySelectorAll('.checkbox-container input:checked')).map(input => ({
            value: input.value,
            label: input.dataset.label
          }));
          const questionId = questions[currentQuestion].id;
          const keys = questionId.split('.');
          let target = state;
          for (let i = 0; i < keys.length - 1; i++) {
            target[keys[i]] = target[keys[i]] || {};
            target = target[keys[i]];
          }
          target[keys[keys.length - 1]] = selected;
          localStorage.setItem('quizState', JSON.stringify(state));
          log('Saved checkbox answer', { questionId, selected });

          currentQuestion++;
          if (currentQuestion < questions.length) {
            log('Advancing to next question', { nextQuestionIndex: currentQuestion, nextQuestionId: questions[currentQuestion]?.id });
            renderQuestion();
          } else {
            log('Quiz completed, showing completion screen');
            showCompletionScreen();
          }
        } catch (error) {
          log('Error saving checkbox answer', { error: error.message, questionId });
          console.error('Error saving checkbox answer:', error);
          document.getElementById('quiz-container').innerHTML = '<p class="error-message">Error: Unable to save answer. Please try again.</p>';
        }
      }

      async function showCompletionScreen() {
        document.querySelector('.progress').classList.add('hidden');
        const container = document.getElementById('quiz-container');
        container.innerHTML = `
          <div class="completion-screen">
            <h1>Reading your story…</h1>
          </div>
        `;
        log('Showing completion screen');
        localStorage.setItem('quizState', JSON.stringify(state));
        log('Navigating directly to /soul-glimpse');
        setTimeout(() => {
          window.location.assign('/soul-glimpse');
        }, 5000);
      }

      function getStateValue(id) {
        try {
          const keys = id.split('.');
          let target = state;
          for (const key of keys) {
            if (!target[key]) {
              log('State value not found', { id, keys });
              return null;
            }
            target = target[key];
          }
          const value = target.value || target;
          log('Retrieved state value', { id, value });
          return value;
        } catch (error) {
          log('Error in getStateValue', { error: error.message, id });
          console.error('Error in getStateValue:', error);
          return null;
        }
      }

      try {
        log('Initializing quiz-3', { state });
        document.querySelector('.progress').classList.add('active');
        document.getElementById('milestone1').classList.add('glow');
        document.getElementById('milestone2').classList.add('glow');
        renderQuestion();
      } catch (error) {
        log('Error initializing quiz', { error: error.message });
        console.error('Error initializing quiz:', error);
        document.getElementById('quiz-container').innerHTML = '<p class="error-message">Error: Unable to initialize quiz. Please try again.</p>';
      }
    </script>
  </div>
</section>
