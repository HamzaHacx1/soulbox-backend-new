<section class="share-confirmation">
  <style>
    html,body{margin:0;min-height:100%;background:#1c255d;color:#f4f2ec;font-family:'Source Serif Pro',Georgia,serif}
    *{box-sizing:border-box}
    .share-confirmation{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:44px 22px;background:radial-gradient(circle at 50% 16%,rgba(77,96,170,.24),transparent 38%),linear-gradient(180deg,#222c68 0%,#141b43 100%);text-align:center}
    .share-shell{width:min(100%,680px);padding:clamp(34px,7vw,52px) clamp(22px,6vw,44px);border:1px solid rgba(244,242,236,.24);border-radius:8px;background:rgba(255,255,255,.035);box-shadow:0 18px 48px rgba(0,0,0,.22)}
    .share-shell h1{margin:0 0 24px;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(38px,8vw,58px);font-weight:500;line-height:1.05;letter-spacing:0}
    .share-copy{max-width:570px;margin:0 auto 30px;font-size:clamp(16px,3vw,18px);line-height:1.62;color:rgba(244,242,236,.88)}
    .share-copy p{margin:0 0 16px}
    .share-copy p:last-child{margin-bottom:0}
    .share-actions{width:min(100%,390px);margin:0 auto;display:grid;gap:13px}
    .share-button{width:100%;min-height:52px;padding:13px 22px;border:1px solid #f4f2ec;border-radius:8px;background:#f4f2ec;color:#111a3e;font-family:'Source Serif Pro',Georgia,serif;font-size:17px;font-weight:700;line-height:1.3;cursor:pointer;transition:transform .18s ease,filter .18s ease}
    .share-button:hover{transform:translateY(-2px);filter:brightness(1.05)}
    .share-button:disabled{opacity:.58;cursor:wait;transform:none}
    .share-button.secondary{display:none;background:transparent;color:#f4f2ec;border-color:rgba(244,242,236,.65);font-weight:600}
    .share-button.secondary.is-visible{display:block}
    .share-helper{max-width:470px;margin:22px auto 0;font-size:14px;line-height:1.5;font-style:italic;color:rgba(244,242,236,.68)}
    .share-status{min-height:22px;margin:16px auto 0;font-size:14px;line-height:1.4;color:#d3af55}
    @media(max-width:479px){.share-confirmation{align-items:flex-start;padding:38px 16px}.share-shell{padding:34px 20px}.share-shell h1{font-size:38px}.share-button{font-size:16px}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Source+Serif+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <div class="share-shell">
    <h1>Thank You</h1>
    <div class="share-copy">
      <p>Your profile has been saved and your House journey has begun. Keep an eye on your inbox for your monthly House recommendation.</p>
      <p>While you wait, share your results.</p>
    </div>
    <div class="share-actions">
      <button class="share-button" id="share-results-button" type="button">Share My Results</button>
    </div>
    <div id="individual-cards" class="individual-cards" hidden></div><p class="share-helper">Posting your results? Keep the cards in order, add any audio you like, and tag SoulBox so we can see yours.</p>
    <p class="share-status" id="share-status" aria-live="polite"></p>
  </div>
<!-- CARDS_SCRIPT -->
<style>[hidden]{display:none!important}.individual-cards{display:grid;gap:10px;margin:20px auto;max-width:390px}.individual-card{color:#f4f2ec;padding:10px;border:1px solid rgba(244,242,236,.65);border-radius:6px;text-decoration:none;font-size:14px}</style>
<script>
(function(){
  var button=document.getElementById('share-results-button'),status=document.getElementById('share-status');
  try{
    var cards=window.SoulBoxCards,result=cards.currentResult();
    if(!result)throw new Error('Missing results');
    cards.connectDownload(button,status,document.getElementById('individual-cards'),result,null,true).prepare().catch(function(){});
  }catch(error){button.disabled=true;status.textContent='Your cards are unavailable. Please return to your results.';var link=document.createElement('a');link.href='/soul-glimpse';link.textContent='View your results';link.style.color='inherit';status.appendChild(document.createElement('br'));status.appendChild(link)}
})();
</script>
</section>
